<!--
  Source design for the Open Graph preview image. The deployed asset is
  og-image.png (rendered from this file at 1200x630) - some platforms
  (e.g. LinkedIn, iMessage) don't render SVG previews reliably. Edit this
  file and re-render to update the PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f4f6f8"/>
  <rect x="0" y="0" width="1200" height="14" fill="#2952e3"/>
  <text x="80" y="330" font-family="system-ui, sans-serif" font-weight="800" font-size="72" fill="#161a20">Lee McIlwraith</text>
  <text x="80" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" fill="#5b6472">Director of Strategic Solutions at Natterbox</text>
</svg>
